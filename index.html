<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],

                    colors: {
                        nzblue: '#1e3a8a',

</head>
<body class="bg-pattern text-slate-800 min-h-screen pb-24">

                    🇳🇿

            </div>

                    <button id="btn-view-mode" onclick="setEditMode(false)" class="px-2.5 py-1 text-xs font-medium rounded-lg transition-all text-white bg-slate-700 shadow-sm flex items-center gap-1">
                        <i class="fa-solid fa-eye"></i> <span class="hidden sm:inline">瀏覽</span>
                    </button>
                    <button id="btn-edit-mode" onclick="setEditMode(true)" class="px-2.5 py-1 text-xs font-medium rounded-lg transition-all text-slate-400 hover:text-white flex items-center gap-1">
                        <i class="fa-solid fa-pen-to-square"></i> <span class="hidden sm:inline">編輯 CMS</span>
                    </button>
                </div>

                <!-- Backup Options Dropdown Button -->
                <button onclick="toggleDataMenu()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition-all text-sm relative" title="資料備份與重置">
                    <i class="fa-solid fa-sliders"></i>
                </button>

                <!-- Data Menu Popover -->

                    <button onclick="exportJSON(); toggleDataMenu()" class="w-full text-left px-3 py-2 text-xs font-medium rounded-xl hover:bg-slate-100 flex items-center gap-2 text-slate-700">
                        <i class="fa-solid fa-file-export text-teal-600"></i> 匯出行程 JSON 檔案
                    </button>
                    <label class="w-full text-left px-3 py-2 text-xs font-medium rounded-xl hover:bg-slate-100 flex items-center gap-2 text-slate-700 cursor-pointer">
                        <i class="fa-solid fa-file-import text-blue-600"></i> 匯入行程 JSON 檔案
                        <input type="file" id="import-file" accept=".json" class="hidden" onchange="importJSON(event)">
                    </label>
                    <hr class="my-1 border-slate-100">
                    <button onclick="resetData(); toggleDataMenu()" class="w-full text-left px-3 py-2 text-xs font-medium rounded-xl hover:bg-rose-50 text-rose-600 flex items-center gap-2">
                        <i class="fa-solid fa-rotate-left"></i> 重置為預設行程

                </div>

        </div>

        <!-- Horizontal Scrollable Day Switcher -->

            </div>
        </div>
    </header>

                    <span id="stat-drive-time" class="font-black text-indigo-600 text-sm truncate block">約 -- km</span>

            </div>

            <!-- Filter Categories (View Mode only) -->
            <div id="category-filter-container" class="flex items-center gap-1.5 mt-3 pt-3 border-t border-slate-100 overflow-x-auto no-scrollbar">

                <button onclick="setCategoryFilter('景點')" class="cat-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap" data-cat="景點">🏔 景點</button>

        <!-- Edit Day Title Header Bar (Edit Mode Only) -->

                <span class="text-xs font-bold uppercase text-amber-800 tracking-wider flex items-center gap-1">
                    <i class="fa-solid fa-pen-clip"></i> 天數編輯區 (Day CMS)
                </span>

                    <label class="block text-xs text-slate-500 mb-1 font-medium">住宿名稱/地點 (Lodging)</label>

            </div>

        </section>

    <!-- Floating Action Button for Quick Adding Activity in Edit Mode -->

    <!-- English Phrase Prompt Fullscreen Modal -->

            <div class="flex items-center justify-between border-b border-slate-100 pb-3">

                    <span class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-sm font-bold">💬</span>

                        {

                {

                    title: "基督城 ➔ 蒂卡波湖 (Lake Tekapo) 夢幻藍湖",
                    lodging: "Peppers Bluewater Resort Tekapo",
                    items: [
                        {

                            notes: "車程約 3 小時 15 分鐘，沿途景色寬廣，注意速限 100 km/h", 
                            mapQuery: "Lake Tekapo",

                        {

                            title: "Fairlie Bakehouse 吃超人氣肉餅", 
                            notes: "紐西蘭第一肉餅店！推薦鮭魚鮮蝦餅或豬腳起司餅", 
                            mapQuery: "Fairlie Bakehouse",

                        {

                            notes: "湖畔經典石造教堂，拍蒂卡波牛奶藍湖景", 
                            mapQuery: "Church of the Good Shepherd Tekapo", 
                            phrases: [
                                { label: "合照請託", text: "Could you take a photo of us with the lake in the background, please?" }
                            ],
                            attachments: [],
                            estCost: 0 
                        },
                        { 
                            id: "204", 
                            time: "21:30", 
                            category: "景點", 
                            title: "Tekapo 觀星體驗 (Dark Sky Project)", 
                            notes: "世界級暗空保護區，觀賞銀河與南十字星\n需提早 15 分鐘至遊客中心報到", 
                            mapQuery: "Dark Sky Project Tekapo", 
                            phrases: [
                                { label: "觀星報到", text: "Hi, we booked the 9:30 PM stargazing tour under Wu." },
                                { label: "防寒保暖詢問", text: "Is it cold up on the mountain? Should we wear heavy jackets?" }
                            ],
                            attachments: [
                                { type: "link", name: "Dark Sky Project 觀星預約官網", url: "https://www.darkskyproject.co.nz/" }
                            ],
                            estCost: 180 
                        }
                    ]
                }
            ]
        };

        // App State
        let itineraryData = null;
        let currentDayIndex = 0;
        // 只有網址帶有 ?edit=1 時才開啟編輯模式；一般分享網址維持唯讀。
        const EDITOR_ACCESS = new URLSearchParams(window.location.search).get('edit') === '1';
        let isEditMode = EDITOR_ACCESS;
        let activeCategoryFilter = 'all';

        // LocalStorage Key
        const STORAGE_KEY = 'NZ_TRAVEL_ITINERARY_CMS_DATA_V2';

        // Initialization
        window.onload = async function() {
            await loadData();
            renderApp();

            // 一般分享網址是唯讀；只有加上 ?edit=1 的網址才顯示 CMS 控制。
            if (!EDITOR_ACCESS) {
                const editButton = document.getElementById('btn-edit-mode');
                const dataMenuButton = document.querySelector('button[onclick="toggleDataMenu()"]');
                if (editButton) editButton.classList.add('hidden');
                if (dataMenuButton) dataMenuButton.classList.add('hidden');
                const menu = document.getElementById('data-menu');
                if (menu) menu.classList.add('hidden');
            }
        };

        // 資料載入規則：
        // 編輯網址 (?edit=1)：優先載入這台電腦的 localStorage。
        // 一般分享網址：載入 GitHub Pages 同目錄的 itinerary.json，讓手機/其他裝置看到已發布資料。
        async function loadData() {
            const normalizeData = (data) => {
                if (!data || !Array.isArray(data.days)) throw new Error("行程 JSON 格式不正確");
                data.days.forEach(day => {
                    if (!Array.isArray(day.items)) day.items = [];
                    day.items.forEach(item => {
                        if (!Array.isArray(item.phrases)) {
                            item.phrases = item.englishPhrase ? [{ label: "通用情境", text: item.englishPhrase }] : [];
                        }
                        if (!Array.isArray(item.attachments)) item.attachments = [];
                    });
                });
                return data;
            };

            if (EDITOR_ACCESS) {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        itineraryData = normalizeData(JSON.parse(saved));
                        return;
                    }
                } catch (e) {
                    console.error("無法讀取本機編輯資料：", e);
                }
            }

            try {
                const response = await fetch('./itinerary.json?v=' + Date.now(), { cache: 'no-store' });
                if (!response.ok) throw new Error('找不到 itinerary.json');
                itineraryData = normalizeData(await response.json());

                // 編輯模式第一次開啟時，將已發布資料複製到本機，之後編輯不會直接改動公開版本。
                if (EDITOR_ACCESS && !localStorage.getItem(STORAGE_KEY)) {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(itineraryData));
                }
            } catch (e) {
                console.warn("無法載入已發布的 itinerary.json，改用內建預設行程：", e);
                itineraryData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY));
                if (EDITOR_ACCESS) {
                    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(itineraryData)); } catch (_) {}
                }
            }
        }

        // Save data to LocalStorage
        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(itineraryData));
            } catch (e) {
                showToast("儲存失敗：附件檔案可能過大超出瀏覽器容量", true);
            }
        }

        // Reset to Default Data
        function resetData() {
            if (confirm("確定要重置所有行程嗎？您自己修改的內容將會被回復為預設值。")) {
                itineraryData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY));
                currentDayIndex = 0;
                saveData();
                renderApp();
                showToast("已成功重置為預設行程！");
            }
        }

        // Main Render Loop
        function renderApp() {
            renderDayTabs();
            renderDayHeader();
            renderTimeline();
            updateModeUI();
        }

        // Render Top Day Selector Tabs
        function renderDayTabs() {
            const container = document.getElementById('day-tabs-container');
            container.innerHTML = '';

            itineraryData.days.forEach((day, index) => {
                const isActive = index === currentDayIndex;
                const btn = document.createElement('button');
                btn.onclick = () => {
                    currentDayIndex = index;
                    renderApp();
                };
                btn.className = `px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all flex items-center gap-1.5 ${
                    isActive 
                        ? 'bg-emerald-500 text-white shadow-md shadow-emerald-500/30' 
                        : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`;
                btn.innerHTML = `<span>Day ${day.dayNum}</span>`;
                container.appendChild(btn);
            });

            // If in Edit Mode, append an "+ Add Day" button
            if (isEditMode) {
                const addDayBtn = document.createElement('button');
                addDayBtn.onclick = addNewDay;
                addDayBtn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 transition-all flex items-center gap-1';
                addDayBtn.innerHTML = `<i class="fa-solid fa-plus"></i> 加天數`;
                container.appendChild(addDayBtn);
            }
        }

        // Render Day Stats and Info Overview
        function renderDayHeader() {
            if (!itineraryData.days[currentDayIndex]) {
                currentDayIndex = 0;
            }
            const currentDay = itineraryData.days[currentDayIndex];

            document.getElementById('current-day-title').innerText = `Day ${currentDay.dayNum}: ${currentDay.title || '自訂行程'}`;
            document.getElementById('stat-total-days').innerText = `${itineraryData.days.length} 天`;
            document.getElementById('stat-activities-count').innerText = `${currentDay.items.length} 個項目`;
            document.getElementById('stat-lodging').innerText = currentDay.lodging || '未指定住宿';

            // Calculate estimated costs
            const totalCost = currentDay.items.reduce((sum, item) => sum + (parseFloat(item.estCost) || 0), 0);
            document.getElementById('day-cost-estimate').innerText = `當日開銷: ~$${totalCost} NZD`;

            // Calculate drive estimate badge
            const driveItemsCount = currentDay.items.filter(i => i.category === '交通').length;
            document.getElementById('stat-drive-time').innerText = driveItemsCount > 0 ? `約 ${driveItemsCount * 60} km` : '市區活動';

            // Fill Edit Mode input fields
            document.getElementById('edit-day-title-input').value = currentDay.title || '';
            document.getElementById('edit-day-hotel-input').value = currentDay.lodging || '';
        }

        // Update Day Metadata in Edit Mode
        function updateDayMetadata() {
            const currentDay = itineraryData.days[currentDayIndex];
            currentDay.title = document.getElementById('edit-day-title-input').value;
            currentDay.lodging = document.getElementById('edit-day-hotel-input').value;
            saveData();
            document.getElementById('current-day-title').innerText = `Day ${currentDay.dayNum}: ${currentDay.title}`;
            document.getElementById('stat-lodging').innerText = currentDay.lodging || '未指定住宿';
        }

        // Render Timeline Cards
        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            const currentDay = itineraryData.days[currentDayIndex];
            if (!currentDay || !currentDay.items || currentDay.items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400 bg-white rounded-2xl border border-slate-200/80 p-6">
                        <i class="fa-solid fa-map-location-dot text-4xl mb-3 text-slate-300"></i>
                        <p class="text-sm font-medium">今天尚未安排任何行程</p>
                        ${isEditMode ? '<button onclick="addNewActivity()" class="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">+ 新增第一項行程</button>' : ''}
                    </div>
                `;
                return;
            }

            // Filter items by category
            const filteredItems = currentDay.items.filter(item => {

                container.innerHTML = `

                    </div>
                `;

            filteredItems.forEach((item, index) => {

                };
                const badgeStyle = catStyles[item.category] || 'bg-slate-50 text-slate-700 border-slate-200';

                // Icons map
                const catIcons = {

                };
                const iconClass = catIcons[item.category] || 'fa-location-dot';

                if (isEditMode) {
                    // EDIT MODE CARD TEMPLATE
                    card.innerHTML = `
                        <div class="bg-amber-50/40 border-2 border-amber-300/80 rounded-2xl p-4 shadow-sm space-y-3 relative">
                            <!-- Header Bar -->
                            <div class="flex items-center justify-between border-b border-amber-200/60 pb-2">
                                <span class="text-xs font-black text-amber-800 bg-amber-200 px-2 py-0.5 rounded-md">
                                    #${originalIndex + 1} 行程項目編輯
                                </span>
                                <div class="flex items-center gap-1">
                                    <button onclick="moveActivity(${originalIndex}, -1)" ${originalIndex === 0 ? 'disabled class="opacity-30 text-slate-400 p-1"' : 'class="p-1 hover:bg-amber-200 text-amber-800 rounded"'} title="上移">
                                        <i class="fa-solid fa-arrow-up"></i>

                                        <i class="fa-solid fa-arrow-down"></i>
                                    </button>
                                    <button onclick="deleteActivity(${originalIndex})" class="p-1 hover:bg-rose-100 text-rose-600 rounded ml-2" title="刪除此項">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Inputs Grid -->
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                <div>
                                    <label class="block text-[11px] text-slate-500 font-bold mb-0.5">時間 (Time)</label>
                                    <input type="text" value="${escapeHtml(item.time || '')}" oninput="updateActivityField(${originalIndex}, 'time', this.value)" class="w-full text-xs p-2 rounded-xl border border-slate-300 font-mono">
                                </div>
                                <div>
                                    <label class="block text-[11px] text-slate-500 font-bold mb-0.5">分類 (Category)</label>
                                    <select onchange="updateActivityField(${originalIndex}, 'category', this.value)" class="w-full text-xs p-2 rounded-xl border border-slate-300">
                                        <option value="景點" ${item.category === '景點' ? 'selected' : ''}>🏔 景點</option>
                                        <option value="美食" ${item.category === '美食' ? 'selected' : ''}>🍽 美食</option>
                                        <option value="交通" ${item.category === '交通' ? 'selected' : ''}>🚗 交通</option>
                                        <option value="住宿" ${item.category === '住宿' ? 'selected' : ''}>🏨 住宿</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[11px] text-slate-500 font-bold mb-0.5">預估費用 (NZD)</label>
                                    <input type="number" value="${item.estCost || 0}" oninput="updateActivityField(${originalIndex}, 'estCost', this.value)" class="w-full text-xs p-2 rounded-xl border border-slate-300">
                                </div>
                            </div>

                            <div>
                                <label class="block text-[11px] text-slate-500 font-bold mb-0.5">行程名稱 (Title)</label>
                                <input type="text" value="${escapeHtml(item.title || '')}" oninput="updateActivityField(${originalIndex}, 'title', this.value)" class="w-full text-xs p-2 rounded-xl border border-slate-300 font-bold">
                            </div>

                            <div>
                                <label class="block text-[11px] text-slate-500 font-bold mb-0.5">備註與說明 (支援換行)</label>
                                <textarea oninput="updateActivityField(${originalIndex}, 'notes', this.value)" class="w-full text-xs p-2 rounded-xl border border-slate-300 h-20">${escapeHtml(item.notes || '')}</textarea>
                            </div>

                            <div>
                                <label class="block text-[11px] text-slate-500 font-bold mb-0.5">Google 地圖搜尋名稱/地標</label>
                                <input type="text" value="${escapeHtml(item.mapQuery || '')}" oninput="updateActivityField(${originalIndex}, 'mapQuery', this.value)" class="w-full text-xs p-2 rounded-xl border border-slate-300" placeholder="例如: Fairlie Bakehouse">
                            </div>

                            <!-- Multiple English Phrases Section (CMS) -->
                            <div class="bg-indigo-50/60 p-3 rounded-xl border border-indigo-100 space-y-2">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-bold text-indigo-800 flex items-center gap-1">
                                        <i class="fa-solid fa-comment-dots"></i> 實用英文對話/情境例句 (多句)
                                    </span>
                                    <button onclick="addPhraseToActivity(${originalIndex})" class="text-[11px] font-bold bg-indigo-600 text-white px-2 py-0.5 rounded-lg hover:bg-indigo-700 transition-all">

                                    </button>
                                </div>
                                <div class="space-y-2" id="phrases-editor-${originalIndex}">
                                    ${renderPhrasesEditor(originalIndex, item.phrases || [])}
                                </div>
                            </div>

                            <!-- Attachments CMS Section (Links / File Upload) -->
                            <div class="bg-slate-100/70 p-3 rounded-xl border border-slate-200 space-y-2">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-bold text-slate-700 flex items-center gap-1">
                                        <i class="fa-solid fa-paperclip"></i> 附件管理 (網址連結 / 電子票券 / 檔案)
                                    </span>
                                    <div class="flex gap-1">
                                        <button onclick="addLinkAttachment(${originalIndex})" class="text-[11px] font-bold bg-slate-700 text-white px-2 py-0.5 rounded-lg hover:bg-slate-800 transition-all">
                                            + 網址連結
                                        </button>
                                        <label class="text-[11px] font-bold bg-teal-600 text-white px-2 py-0.5 rounded-lg hover:bg-teal-700 transition-all cursor-pointer">
                                            + 上傳檔案
                                            <input type="file" class="hidden" onchange="uploadFileAttachment(${originalIndex}, event)">
                                        </label>
                                    </div>
                                </div>
                                <div class="space-y-1.5" id="attachments-editor-${originalIndex}">
                                    ${renderAttachmentsEditor(originalIndex, item.attachments || [])}
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // VIEW MODE CARD TEMPLATE
                    const mapUrl = item.mapQuery ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.mapQuery)}` : '#';
                    const phraseCount = (item.phrases || []).length;
                    const attachmentCount = (item.attachments || []).length;

                    card.innerHTML = `
                        <!-- Left Timeline Node Line -->
                        <div class="absolute -left-3 sm:-left-6 top-6 bottom-0 w-0.5 bg-slate-200"></div>
                        <div class="absolute -left-[17px] sm:-left-[29px] top-5 w-6 h-6 rounded-full bg-white border-2 border-emerald-500 text-emerald-600 flex items-center justify-center text-[10px] shadow-sm z-10">
                            <i class="fa-solid ${iconClass}"></i>
                        </div>

                        <!-- Card Main Container -->
                        <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200/80 hover:shadow-md transition-all">
                            <!-- Time & Category Row -->
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-black font-mono text-slate-800 bg-slate-100 px-2.5 py-1 rounded-lg">
                                        <i class="fa-regular fa-clock text-slate-400 mr-1"></i>${escapeHtml(item.time || '未訂')}
                                    </span>
                                    <span class="text-xs font-bold px-2.5 py-1 rounded-lg border ${badgeStyle}">
                                        ${escapeHtml(item.category)}
                                    </span>
                                </div>
                                ${item.estCost ? `<span class="text-xs text-slate-400 font-medium">$${item.estCost} NZD</span>` : ''}
                            </div>

                            <!-- Title -->
                            <h3 class="text-base font-bold text-slate-800 mb-1.5 leading-snug">
                                ${escapeHtml(item.title)}
                            </h3>

                            <!-- Notes with preserve-newlines -->
                            ${item.notes ? `<p class="text-xs text-slate-600 mb-3 bg-slate-50/80 p-2.5 rounded-xl border border-slate-100 leading-relaxed preserve-newlines">${escapeHtml(item.notes)}</p>` : ''}

                            <!-- View Mode Attachments Chips Container -->
                            ${attachmentCount > 0 ? `
                                <div class="mb-3 space-y-1">
                                    <div class="text-[11px] font-bold text-slate-400">📎 附件與相關連結:</div>
                                    <div class="flex flex-wrap gap-2">
                                        ${item.attachments.map(att => `
                                            <a href="${att.url || att.data}" target="_blank" rel="noopener noreferrer" download="${att.type === 'file' ? att.name : ''}" class="inline-flex items-center gap-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-xl border border-slate-200 transition-all font-medium">
                                                <i class="fa-solid ${att.type === 'link' ? 'fa-link text-blue-500' : 'fa-file-pdf text-rose-500'}"></i>
                                                <span class="truncate max-w-[180px]">${escapeHtml(att.name)}</span>
                                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-slate-400"></i>
                                            </a>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            <!-- Action Buttons Row -->
                            <div class="flex items-center gap-2 pt-2 border-t border-slate-100 flex-wrap">
                                ${item.mapQuery ? `
                                    <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-bold transition-all flex items-center gap-1.5 border border-blue-200/60">
                                        <i class="fa-solid fa-map-location-dot text-blue-600"></i> 開地圖
                                    </a>
                                ` : ''}

                                ${phraseCount > 0 ? `
                                    <button onclick="openPhraseModalForActivity(${originalIndex})" class="px-3 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold transition-all flex items-center gap-1.5 border border-indigo-200/60">
                                        <i class="fa-solid fa-comment-dots text-indigo-600"></i> 英文對話 (${phraseCount} 句)
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }

                container.appendChild(card);
            });
        }

        // Helper: Render Phrases Editor in CMS
        function renderPhrasesEditor(actIndex, phrases) {
            if (!phrases || phrases.length === 0) {
                return `<div class="text-[11px] text-indigo-400 italic">尚無對話例句，點擊「+ 新增例句」即可加入</div>`;
            }

            return phrases.map((p, pIdx) => `
                <div class="bg-white p-2 rounded-lg border border-indigo-100 space-y-1">
                    <div class="flex items-center justify-between gap-2">
                        <input type="text" value="${escapeHtml(p.label || '')}" placeholder="情境/情節名稱 (如: 詢問保險)" oninput="updatePhraseField(${actIndex}, ${pIdx}, 'label', this.value)" class="text-xs p-1 rounded border border-slate-200 font-bold text-indigo-900 w-1/3">
                        <button onclick="removePhraseFromActivity(${actIndex}, ${pIdx})" class="text-rose-500 hover:text-rose-700 text-xs p-1">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <textarea placeholder="英文例句內容..." oninput="updatePhraseField(${actIndex}, ${pIdx}, 'text', this.value)" class="w-full text-xs p-1.5 rounded border border-slate-200 h-12">${escapeHtml(p.text || '')}</textarea>
                </div>
            `).join('');
        }

        // Helper: Render Attachments Editor in CMS
        function renderAttachmentsEditor(actIndex, attachments) {
            if (!attachments || attachments.length === 0) {
                return `<div class="text-[11px] text-slate-400 italic">尚無附件或連結，可上方新增網址或上傳檔案</div>`;
            }

            return attachments.map((att, attIdx) => `
                <div class="flex items-center justify-between bg-white p-2 rounded-lg border border-slate-200 text-xs gap-2">
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                        <i class="fa-solid ${att.type === 'link' ? 'fa-link text-blue-500' : 'fa-file-lines text-teal-500'}"></i>
                        <input type="text" value="${escapeHtml(att.name || '')}" placeholder="附件/連結標題" oninput="updateAttachmentName(${actIndex}, ${attIdx}, this.value)" class="text-xs p-1 rounded border border-slate-200 font-bold flex-1">
                        ${att.type === 'link' ? `
                            <input type="text" value="${escapeHtml(att.url || '')}" placeholder="https://..." oninput="updateAttachmentUrl(${actIndex}, ${attIdx}, this.value)" class="text-xs p-1 rounded border border-slate-200 flex-1">
                        ` : `<span class="text-[10px] text-slate-400">[檔案已就緒]</span>`}
                    </div>
                    <button onclick="removeAttachmentFromActivity(${actIndex}, ${attIdx})" class="text-rose-500 hover:text-rose-700 p-1">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `).join('');
        }

        // Phrase CMS actions
        function addPhraseToActivity(actIndex) {
            const item = itineraryData.days[currentDayIndex].items[actIndex];
            if (!item.phrases) item.phrases = [];
            item.phrases.push({ label: "新對話情境", text: "How much does this cost?" });
            saveData();
            renderTimeline();
        }

        function updatePhraseField(actIndex, phraseIndex, field, value) {
            const item = itineraryData.days[currentDayIndex].items[actIndex];
            if (item && item.phrases && item.phrases[phraseIndex]) {
                item.phrases[phraseIndex][field] = value;
                saveData();
            }
        }

        function removePhraseFromActivity(actIndex, phraseIndex) {
            const item = itineraryData.days[currentDayIndex].items[actIndex];
            if (item && item.phrases) {
                item.phrases.splice(phraseIndex, 1);
                saveData();
                renderTimeline();
            }
        }

        // Attachment CMS actions
        function addLinkAttachment(actIndex) {
            const item = itineraryData.days[currentDayIndex].items[actIndex];
            if (!item.attachments) item.attachments = [];
            item.attachments.push({ type: 'link', name: '預約確認連結/網頁', url: 'https://' });
            saveData();
            renderTimeline();
        }

        function uploadFileAttachment(actIndex, event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                showToast("檔案建議小於 5MB 以確保儲存順暢", true);
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const item = itineraryData.days[currentDayIndex].items[actIndex];
                if (!item.attachments) item.attachments = [];
                item.attachments.push({
                    type: 'file',
                    name: file.name,
                    data: e.target.result
                });
                saveData();
                renderTimeline();
                showToast("檔案已成功附加！");
            };
            reader.readAsDataURL(file);
        }

        function updateAttachmentName(actIndex, attIndex, value) {
            const item = itineraryData.days[currentDayIndex].items[actIndex];
            if (item && item.attachments && item.attachments[attIndex]) {
                item.attachments[attIndex].name = value;
                saveData();
            }
        }

        function updateAttachmentUrl(actIndex, attIndex, value) {
            const item = itineraryData.days[currentDayIndex].items[actIndex];
            if (item && item.attachments && item.attachments[attIndex]) {
                item.attachments[attIndex].url = value;
                saveData();
            }
        }

        function removeAttachmentFromActivity(actIndex, attIndex) {
            const item = itineraryData.days[currentDayIndex].items[actIndex];
            if (item && item.attachments) {
                item.attachments.splice(attIndex, 1);
                saveData();
                renderTimeline();
            }
        }

        // Open Phrases Modal for Activity
        function openPhraseModalForActivity(actIndex) {
            const item = itineraryData.days[currentDayIndex].items[actIndex];
            if (!item || !item.phrases || item.phrases.length === 0) return;

            document.getElementById('phrase-modal-title').innerText = `${item.title} - 實用對話 (${item.phrases.length} 句)`;
            const listContainer = document.getElementById('phrase-modal-list');
            listContainer.innerHTML = '';

            item.phrases.forEach((p, idx) => {
                const card = document.createElement('div');
                card.className = "bg-gradient-to-br from-indigo-50/70 to-blue-50/70 rounded-2xl p-4 border border-indigo-100 space-y-3";
                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-indigo-100/80 pb-2">
                        <span class="text-xs font-bold text-indigo-700 bg-indigo-100/80 px-2.5 py-0.5 rounded-md">
                            💡 ${escapeHtml(p.label || '對話情境')}
                        </span>
                        <span class="text-[11px] text-slate-400">#${idx + 1}</span>
                    </div>
                    <p class="text-lg sm:text-xl font-black text-slate-900 tracking-wide leading-relaxed select-all">
                        "${escapeHtml(p.text)}"
                    </p>
                    <div class="flex items-center gap-2 pt-1">
                        <button onclick="speakText('${escapeHtml(p.text)}')" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-sm transition-all active:scale-95">
                            <i class="fa-solid fa-volume-high"></i> 朗讀聲音
                        </button>
                        <button onclick="copyTextToClipboard('${escapeHtml(p.text)}')" class="flex-1 py-2 bg-white hover:bg-slate-50 text-slate-700 font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 border border-slate-200 transition-all active:scale-95">
                            <i class="fa-solid fa-copy"></i> 複製文字
                        </button>
                    </div>
                `;
                listContainer.appendChild(card);
            });

            document.getElementById('phrase-modal').classList.remove('hidden');
        }

        function closePhraseModal() {
            document.getElementById('phrase-modal').classList.add('hidden');
        }

        // TTS & Copy Helpers
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
                showToast("🔊 正在發音朗讀...");
            } else {
                showToast("您的瀏覽器不支援語音朗讀", true);
            }
        }

        function copyTextToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast("已複製英文對話至剪貼簿！");
                }).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast("已複製英文對話至剪貼簿！");
        }

        // Toggle Edit Mode
        function setEditMode(enable) {
            if (enable && !EDITOR_ACCESS) {
                showToast("此網址為唯讀模式。請使用你的編輯網址。", true);
                return;
            }
            isEditMode = enable;
            saveData();
            renderApp();
            showToast(isEditMode ? "已切換至「編輯 CMS 模式」" : "已切換至「瀏覽模式」");
        }

        // Update Toggle Buttons UI
        function updateModeUI() {
            const btnView = document.getElementById('btn-view-mode');
            const btnEdit = document.getElementById('btn-edit-mode');
            const subtitle = document.getElementById('header-subtitle');
            const editControls = document.getElementById('edit-day-controls');
            const addItemBar = document.getElementById('add-item-bar');
            const fab = document.getElementById('fab-add');
            const catFilters = document.getElementById('category-filter-container');

            if (isEditMode) {
                btnView.className = 'px-2.5 py-1 text-xs font-medium rounded-lg transition-all text-slate-400 hover:text-white flex items-center gap-1';
                btnEdit.className = 'px-2.5 py-1 text-xs font-medium rounded-lg transition-all text-white bg-amber-600 shadow-sm flex items-center gap-1';
                subtitle.innerText = "編輯模式 (可即時修改)";
                document.getElementById('current-mode-badge').className = "inline-block w-2 h-2 rounded-full bg-amber-400 animate-ping";

                editControls.classList.remove('hidden');
                addItemBar.classList.remove('hidden');
                fab.classList.remove('hidden');
                catFilters.classList.add('hidden');
            } else {
                btnView.className = 'px-2.5 py-1 text-xs font-medium rounded-lg transition-all text-white bg-slate-700 shadow-sm flex items-center gap-1';
                btnEdit.className = 'px-2.5 py-1 text-xs font-medium rounded-lg transition-all text-slate-400 hover:text-white flex items-center gap-1';
                subtitle.innerText = "瀏覽模式 (唯讀)";
                document.getElementById('current-mode-badge').className = "inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse";

                editControls.classList.add('hidden');
                addItemBar.classList.add('hidden');
                fab.classList.add('hidden');
                catFilters.classList.remove('hidden');
            }
        }

        // Category Filter Function
        function setCategoryFilter(category) {
            activeCategoryFilter = category;
            document.querySelectorAll('.cat-filter-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === category) {
                    btn.className = 'cat-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-800 text-white shadow-sm transition-all whitespace-nowrap';
                } else {
                    btn.className = 'cat-filter-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all whitespace-nowrap';
                }
            });
            renderTimeline();
        }

        // Add New Activity Item
        function addNewActivity() {
            const currentDay = itineraryData.days[currentDayIndex];
            const newItem = {
                id: Date.now().toString(),
                time: "12:00",
                category: "景點",
                title: "新行程項目",
                notes: "點擊此處輸入詳細說明...",
                mapQuery: "",
                phrases: [
                    { label: "詢問處", text: "Excuse me, where is the main entrance?" }
                ],
                attachments: [],
                estCost: 0
            };
            currentDay.items.push(newItem);
            saveData();
            renderApp();
            showToast("已新增一項行程！");
        }

        // Update Specific Field in Activity
        function updateActivityField(index, field, value) {
            const currentDay = itineraryData.days[currentDayIndex];
            if (currentDay && currentDay.items[index]) {
                currentDay.items[index][field] = value;
                saveData();
                renderDayHeader();
            }
        }

        // Move Activity Item Up / Down
        function moveActivity(index, direction) {
            const items = itineraryData.days[currentDayIndex].items;
            const targetIndex = index + direction;
            if (targetIndex >= 0 && targetIndex < items.length) {
                const temp = items[index];
                items[index] = items[targetIndex];
                items[targetIndex] = temp;
                saveData();
                renderTimeline();
            }
        }

        // Delete Activity Item
        function deleteActivity(index) {
            if (confirm("確定要刪除此項行程嗎？")) {
                itineraryData.days[currentDayIndex].items.splice(index, 1);
                saveData();
                renderApp();
                showToast("行程已刪除");
            }
        }

        // Add Entire New Day
        function addNewDay() {
            const newDayNum = itineraryData.days.length + 1;
            const newDay = {
                dayNum: newDayNum,
                title: `第 ${newDayNum} 天行程`,
                lodging: "自訂住宿地點",
                items: [
                    {
                        id: Date.now().toString(),
                        time: "09:00",
                        category: "景點",
                        title: "展開精彩一日探險",
                        notes: "在此輸入今天的行程概要",
                        mapQuery: "New Zealand",
                        phrases: [{ label: "問候", text: "Good morning!" }],
                        attachments: [],
                        estCost: 0
                    }
                ]
            };
            itineraryData.days.push(newDay);
            currentDayIndex = itineraryData.days.length - 1;
            saveData();
            renderApp();
            showToast(`已新增 Day ${newDayNum}！`);
        }

        // Delete Entire Current Day
        function deleteCurrentDay() {
            if (itineraryData.days.length <= 1) {
                showToast("至少需保留一天行程！", true);
                return;
            }
            if (confirm(`確定要刪除整個 Day ${itineraryData.days[currentDayIndex].dayNum} 嗎？`)) {
                itineraryData.days.splice(currentDayIndex, 1);
                itineraryData.days.forEach((day, i) => {
                    day.dayNum = i + 1;
                });
                currentDayIndex = Math.max(0, currentDayIndex - 1);
                saveData();
                renderApp();
                showToast("已刪除該天數");
            }
        }

        // Popover Data Menu Toggle
        function toggleDataMenu() {
            const menu = document.getElementById('data-menu');
            menu.classList.toggle('hidden');
        }

        // 匯出 JSON：固定命名 itinerary.json，方便直接上傳並取代 GitHub 上的發布資料。
        function exportJSON() {
            const blob = new Blob(
                [JSON.stringify(itineraryData, null, 2)],
                { type: "application/json;charset=utf-8" }
            );
            const url = URL.createObjectURL(blob);
            const dlAnchor = document.createElement('a');
            dlAnchor.href = url;
            dlAnchor.download = "itinerary.json";
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            URL.revokeObjectURL(url);
            showToast("已匯出 itinerary.json；上傳到 GitHub 取代舊檔後，手機就能看到新內容。");
        }

        // Import JSON File
        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && Array.isArray(parsed.days)) {
                        itineraryData = parsed;
                        currentDayIndex = 0;
                        saveData();
                        renderApp();
                        showToast("成功匯入行程檔案！");
                    } else {
                        showToast("JSON 格式不符！", true);
                    }
                } catch (err) {
                    showToast("檔案讀取失敗，請確認為合法 JSON", true);
                }
            };
            reader.readAsText(file);
        }

        // Toast Helper
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toast-msg');
            const icon = document.getElementById('toast-icon');

            msgSpan.innerText = msg;
            if (isError) {
                icon.className = "fa-solid fa-circle-exclamation text-rose-400";
            } else {
                icon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Escape HTML Helper
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
